# Register configuration for bblocks-process-profiles
# Structure follows GeoLabs/bblocks-eoap-cct.

identifier-prefix: ospd.process-profiles.

name: OSPD Process Profiles

abstract: |
  OGC API - Processes profiles for the deployable CWL processes of the OSPD 2026 reference
  workflows (W1 Algae Bloom, W2 KindGrove mangrove biomass, W3 Water Bodies detection), each
  linked to its CWL source, the generic provenance profile, the EOAP CWL custom types and the
  openEO Building Blocks.

description: |
  This register is produced by GeoLabs under OSPD 2026 (D100 Workflow Profiler, D120 OGC API
  Processes Profiler). It holds one Building Block per deployable CWL process (`CommandLineTool`
  or `Workflow`) identified in the workflow observability investigation.

  Each process profile combines:

  - a reference to the source CWL (linked by URL at a pinned commit, never copied);
  - an OGC API - Processes Part 1 `processDescription` derived with the
    `eoap.cct.cwl-to-ogcprocess` mapping (deviations are documented, not hidden);
  - a provenance view expressed as an instance of the generic provenance profile
    (`ogc.bbr.provenance.*`);
  - a candidate process-type entry (`ospd.process-profiles.process-type`) for the OSPD
    process-type register (Activity 4);
  - proposed openEO equivalences (`ogc.openeo.*`) with an explicit level
    (exactMatch / closeMatch / none) and rationale;
  - a representative execution example.

  All mappings are proposed correspondences offered for review, not settled equivalences.

contact:
  name: GeoLabs SARL
  url: https://www.geolabs.fr/

version: 0.1.0

baseURL: https://geolabs.github.io/bblocks-process-profiles/
gitHubBaseURL: https://github.com/GeoLabs/bblocks-process-profiles/

keywords:
  - OSPD
  - OGC API Processes
  - CWL
  - Application Package
  - provenance
  - W3C PROV
  - openEO
  - process type

imports:
  # OGC main register
  - default
  # Mandatory: generic provenance profile (Activity 1)
  - https://geolabs.github.io/bblocks-generic-provenance-profile/build/register.json
  # EOAP CWL custom types + cwl-to-ogcprocess mapping (GeoLabs origin)
  - https://geolabs.github.io/bblocks-eoap-cct/build/register.json
  # openEO processes and types
  - https://geolabs.github.io/bblocks-openeo/build/register.json
  # OGC API - Processes: Part 1 schemas, Part 2 (DRU) schemas, standard-as-BBs (Part 1 Core requirements class)
  - https://geolabs.github.io/bblocks-ogcapi-processes/build/register.json
  - https://geolabs.github.io/bblock-ogcapi-processes-part2/build/register.json
  - https://geolabs.github.io/ogcapi-processes-standard-as-bblocks/build/register.json
  # Incubator provenance registers, used only where the generic profile has gaps
  # (already imported transitively by the generic profile; listed for explicitness)
  - https://ogcincubator.github.io/bblock-prov-schema/build/register.json
  - https://ogcincubator.github.io/bblocks-wf4ever/build/register.json
  # W3C PROV serialisations (experimental, under-development): the cwltool CWLProv bundles as
  # W3C PROV-JSONLD examples (`ogc.ogc-utils.prov.w3c-prov-jsonld`), see docs/OPEN-QUESTIONS.md Q-W3C
  - https://ogcincubator.github.io/bblocks-prov-jsonld-alt/build/register.json

schema-oas30-downcompile: False

