$schema: https://json-schema.org/draft/2020-12/schema
description: Profile of the OGC API - Processes processDescription of `estimate_biomass` (CWL CommandLineTool).
  Pins the process id and the input/output names; the input/output schemas are those derived from the
  CWL.
allOf:
- $ref: bblocks://ogc.api.processes.v1.schemas.process
- $ref: bblocks://ogc.api.processes.v2.schemas.staticIndicator
- type: object
  required:
  - id
  - version
  - inputs
  - outputs
  properties:
    id:
      const: estimate_biomass
    inputs:
      type: object
      required:
      - ndvi_file
      - ndwi_file
      - savi_file
      - stac_item
      - ndvi_min
      - ndvi_max
      - ndwi_min
      - savi_min
      - biomass_slope
      - biomass_intercept
      - carbon_fraction
      propertyNames:
        enum:
        - ndvi_file
        - ndwi_file
        - savi_file
        - stac_item
        - ndvi_min
        - ndvi_max
        - ndwi_min
        - savi_min
        - biomass_slope
        - biomass_intercept
        - carbon_fraction
    outputs:
      type: object
      required:
      - mangrove_mask_file
      - biomass_file
      - biomass_summary_file
      - carbon_summary_file
      - analysis_summary_file
      propertyNames:
        enum:
        - mangrove_mask_file
        - biomass_file
        - biomass_summary_file
        - carbon_summary_file
        - analysis_summary_file
$defs:
  rawProcessDescription:
    $ref: bblocks://ogc.api.processes.v1.schemas.process
  applicationPackage:
    $ref: bblocks://ogc.api.processes.v2.schemas.ogcapppkg
  provenance:
    $ref: bblocks://ogc.bbr.provenance.provenance
  processTypeEntry:
    $ref: bblocks://ospd.process-profiles.process-type
  w3cProvJsonLd:
    $ref: bblocks://ogc.ogc-utils.prov.w3c-prov-jsonld
  execute:
    description: Execute request for this process. Built on the processDescription input schemas and on
      ogc.api.processes.v1.schemas.link / qualifiedInputValue, because ogc.api.processes.v1.schemas.execute
      rejects plain strings and numbers (upstream issue U-01).
    type: object
    required:
    - inputs
    properties:
      inputs:
        type: object
        required:
        - ndvi_file
        - ndwi_file
        - savi_file
        - stac_item
        propertyNames:
          enum:
          - ndvi_file
          - ndwi_file
          - savi_file
          - stac_item
          - ndvi_min
          - ndvi_max
          - ndwi_min
          - savi_min
          - biomass_slope
          - biomass_intercept
          - carbon_fraction
        additionalProperties:
          anyOf:
          - $ref: bblocks://ogc.api.processes.v1.schemas.link
          - $ref: bblocks://ogc.api.processes.v1.schemas.qualifiedInputValue
          - type:
            - string
            - number
            - integer
            - boolean
            - array
            - object
      outputs:
        type: object
        propertyNames:
          enum:
          - mangrove_mask_file
          - biomass_file
          - biomass_summary_file
          - carbon_summary_file
          - analysis_summary_file
      response:
        enum:
        - raw
        - document
  results:
    description: Results document (response=document) for this process (see U-01).
    type: object
    propertyNames:
      enum:
      - mangrove_mask_file
      - biomass_file
      - biomass_summary_file
      - carbon_summary_file
      - analysis_summary_file
    additionalProperties:
      anyOf:
      - $ref: bblocks://ogc.api.processes.v1.schemas.link
      - type: array
        items:
          $ref: bblocks://ogc.api.processes.v1.schemas.link
      - type:
        - string
        - number
        - integer
        - boolean
        - array
        - object
  processRun:
    $ref: bblocks://ogc.bbr.wf4ever.wfprov.ProcessRun
