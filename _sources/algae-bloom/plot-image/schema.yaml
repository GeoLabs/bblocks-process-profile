$schema: https://json-schema.org/draft/2020-12/schema
description: Profile of the OGC API - Processes processDescription of `plot-image` (CWL CommandLineTool).
  Pins the process id and the input/output names; the input/output schemas are those derived from the
  CWL.
allOf:
- $ref: bblocks://ogc.api.processes.v1.schemas.process
- $ref: bblocks://ogc.api.processes.v2.schemas.staticIndicator
- type: object
  required:
  - id
  - version
  - inputs
  - outputs
  properties:
    id:
      const: plot-image
    inputs:
      type: object
      required:
      - input_image
      - color_scale
      - output_name
      - plot_name
      - plot_title
      - clip_min
      - clip_max
      propertyNames:
        enum:
        - input_image
        - color_scale
        - output_name
        - plot_name
        - plot_title
        - clip_min
        - clip_max
    outputs:
      type: object
      required:
      - output_file
      - output_plot
      propertyNames:
        enum:
        - output_file
        - output_plot
$defs:
  rawProcessDescription:
    $ref: bblocks://ogc.api.processes.v1.schemas.process
  applicationPackage:
    $ref: bblocks://ogc.api.processes.v2.schemas.ogcapppkg
  provenance:
    $ref: bblocks://ogc.bbr.provenance.provenance
  processTypeEntry:
    $ref: bblocks://ospd.process-profiles.process-type
  w3cProvJsonLd:
    $ref: bblocks://ogc.ogc-utils.prov.w3c-prov-jsonld
  execute:
    description: Execute request for this process. Built on the processDescription input schemas and on
      ogc.api.processes.v1.schemas.link / qualifiedInputValue, because ogc.api.processes.v1.schemas.execute
      rejects plain strings and numbers (upstream issue U-01).
    type: object
    required:
    - inputs
    properties:
      inputs:
        type: object
        required:
        - input_image
        - color_scale
        propertyNames:
          enum:
          - input_image
          - color_scale
          - output_name
          - plot_name
          - plot_title
          - clip_min
          - clip_max
        additionalProperties:
          anyOf:
          - $ref: bblocks://ogc.api.processes.v1.schemas.link
          - $ref: bblocks://ogc.api.processes.v1.schemas.qualifiedInputValue
          - type:
            - string
            - number
            - integer
            - boolean
            - array
            - object
      outputs:
        type: object
        propertyNames:
          enum:
          - output_file
          - output_plot
      response:
        enum:
        - raw
        - document
  results:
    description: Results document (response=document) for this process (see U-01).
    type: object
    propertyNames:
      enum:
      - output_file
      - output_plot
    additionalProperties:
      anyOf:
      - $ref: bblocks://ogc.api.processes.v1.schemas.link
      - type: array
        items:
          $ref: bblocks://ogc.api.processes.v1.schemas.link
      - type:
        - string
        - number
        - integer
        - boolean
        - array
        - object
  processRun:
    $ref: bblocks://ogc.bbr.wf4ever.wfprov.ProcessRun
